steps:
   # 0. Validación con SQLFluff
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Validando estilo SQL con SQLFluff..."
        pip install --break-system-packages sqlfluff
        sqlfluff lint sql/ --dialect bigquery

  # 1. DDL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Aplicando DDL..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/ddl/tablas_riesgos.sql

  # 2. Seed
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ROWS=$(bq query --use_legacy_sql=false --project_id=${REPO_NAME} --format=csv "SELECT COUNT(*) FROM \`riesgos.transacciones\`" | tail -n 1)
        if [ "$$ROWS" -eq "0" ]; then
          echo ">> Cargando datos de muestra..."
          bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/seed/load_sample_data.sql
        else
          echo ">> Saltando seed (ya hay $$ROWS filas)"
        fi

  # 3. Caso 1 AML
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte AML (Caso 1)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_1_aml.sql

  # 4. Caso 2 Smurfing
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Smurfing (Caso 2)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_2_smurfing.sql

  # 5. Caso 3 Saldo Promedio
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Saldo Promedio (Caso 3)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_3_saldo_promedio.sql

  # 6. Caso 6 Anomalía
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Anomalía (Caso 6)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_6_anomalias.SQL

  # 7. Caso 7 Geolocalización
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Geolocalización (Caso 7)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_7_geolocalizacion.sql

  # 8. Caso 10 Percentil
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Percentil Retiros (Caso 10)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/reports/caso_10_percentil_retiros.sql

  # 9. SCD Tipo 2 - Tabla de límites
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Creando tabla limites_riesgo_cliente (SCD Tipo 2)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/ddl/tabla_limites_riesgo.sql

  # 10. Procedimiento almacenado
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Creando procedimiento actualizar_limites_riesgo..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/stored_procedures/sp_actualizar_limites.sql

  # 11. Watermark
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Inicializando watermark..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/watermark/watermark_control.sql

  # 12. Carga incremental (demo)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Ejecutando carga incremental (demo)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/watermark/carga_incremental.sql

 # 13. Script de ingesta desde GCS a BigQuery (alternativa a Dataflow)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Ejecutando script de ingesta desde GCS..."
        cd scripts
        pip install --break-system-packages -r requirements.txt
        python3 ingesta_gcs_a_bigquery.py
# 14. Crear tabla dead-letter
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Creando dead_letter_transacciones..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} < sql/ddl/dead_letter.sql

  # 15. Ejecutar script con validaciones
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Ejecutando ingesta con validaciones..."
        cd scripts
        pip install --break-system-packages -r requirements.txt
        python3 ingesta_con_validaciones.py

  # 16. Consulta de monitoreo
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte de calidad (últimas 24h)..."
        bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100 < sql/monitoreo/alertas_calidad.sql
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET