steps:
  # 1. DDL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Aplicando DDL..."
        cat sql/ddl/tablas_riesgos.sql | sed "s/{{PROJECT_ID}}/${REPO_NAME}/g" | bq query --use_legacy_sql=false --project_id=${REPO_NAME}

  # 2. Seed
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Primero contamos filas para decidir si cargar
        ROWS=$(bq query --use_legacy_sql=false --project_id=${REPO_NAME} --format=csv "SELECT COUNT(*) FROM \`${REPO_NAME}.riesgos.transacciones\`" | tail -n 1)
        if [ "$$ROWS" -eq "0" ]; then
          echo ">> Cargando datos de muestra..."
          cat sql/seed/load_sample_data.sql | sed "s/{{PROJECT_ID}}/${REPO_NAME}/g" | bq query --use_legacy_sql=false --project_id=${REPO_NAME}
        else
          echo ">> Saltando seed (ya hay $$ROWS filas)"
        fi

  # 3. Caso 1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte AML (Caso 1)..."
        cat sql/reports/caso_1_aml.sql | sed "s/{{PROJECT_ID}}/${REPO_NAME}/g" | bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100

  # 4. Caso 2
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ">> Reporte Smurfing (Caso 2)..."
        cat sql/reports/caso_2_smurfing.sql | sed "s/{{PROJECT_ID}}/${REPO_NAME}/g" | bq query --use_legacy_sql=false --project_id=${REPO_NAME} --max_rows=100

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET